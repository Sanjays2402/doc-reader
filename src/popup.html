<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doc Reader</title>
<link rel="stylesheet" href="popup.css">
</head>
<body data-theme="dark">
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>

  <header class="topbar">
    <button id="back-btn" class="icon-btn" title="Back" aria-label="Back to bookmarks" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6 9 12l6 6"/>
      </svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5"/>
          <path d="M6.5 18.5A2.5 2.5 0 0 0 4 21V5.5"/>
          <path d="M6.5 18.5H19V21H6.5A2.5 2.5 0 0 1 6.5 18.5Z"/>
          <path d="M8.5 7.5h7M8.5 11h7M8.5 14.5h4.5"/>
        </svg>
      </span>
      <div class="title" id="view-title">Doc Reader</div>
    </div>
    <button id="review-btn" class="icon-btn" title="Review queue" aria-label="Spaced-repetition review queue">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v13.5"/>
        <path d="M6.5 17.5A2.5 2.5 0 0 0 4 20V6.5"/>
        <path d="M6.5 17.5H20V20H6.5A2.5 2.5 0 0 1 6.5 17.5Z"/>
        <path d="m10.5 9.5 2 2 4-4"/>
      </svg>
      <span id="review-badge" class="badge" hidden aria-hidden="true">0</span>
    </button>
    <button id="history-btn" class="icon-btn" title="Recently read" aria-label="Recently read history">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <path d="M3 4v5h5"/>
        <path d="M12 7v5l3 2"/>
      </svg>
    </button>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 16.9l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7.1 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
      </svg>
    </button>
  </header>

  <section class="search">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
    </span>
    <input id="search-input" type="search" placeholder="Search bookmarks"
      autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search bookmarks">
    <button id="search-clear" class="icon-btn ghost" title="Clear" aria-label="Clear search" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
  </section>

  <main id="root" class="content" role="list" aria-label="Bookmarked sections"></main>

  <section id="settings-view" class="content settings" aria-label="Per-site settings" hidden>
    <div class="settings-head">
      <h2 class="settings-title">Sites</h2>
      <p class="settings-hint">Toggle Doc Reader off on sites you'd rather read raw.</p>
    </div>
    <ul id="site-list" class="site-list"></ul>
  </section>

  <section id="review-view" class="content review" aria-label="Spaced-repetition review queue" hidden>
    <div class="review-head">
      <div>
        <h2 class="review-title">Review queue</h2>
        <p class="review-hint">Recall the section, then rate how it felt. Cards reschedule via SM-2.</p>
      </div>
      <span id="review-stats" class="review-stats" aria-live="polite"></span>
    </div>
    <ul id="review-list" class="review-list"></ul>
  </section>

  <template id="tpl-review-card">
    <li class="sr-card">
      <div class="sr-meta">
        <span class="sr-dot" aria-hidden="true"></span>
        <div class="sr-text">
          <button class="sr-open" type="button" title="Open section">
            <span class="sr-title"></span>
          </button>
          <span class="sr-sub">
            <span class="sr-site"></span>
            <span class="sr-path"></span>
          </span>
        </div>
        <span class="sr-due" title="Reps · interval"></span>
      </div>
      <div class="sr-actions" role="group" aria-label="Rate recall">
        <button class="sr-btn sr-again" type="button" data-grade="again" title="Couldn't recall — show again soon">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
          </svg>
          <span>Again</span>
        </button>
        <button class="sr-btn sr-good" type="button" data-grade="good" title="Recalled with effort">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12 4 4 10-10"/>
          </svg>
          <span>Good</span>
        </button>
        <button class="sr-btn sr-easy" type="button" data-grade="easy" title="Easy — push out further">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
          <span>Easy</span>
        </button>
      </div>
    </li>
  </template>

  <section id="history-view" class="content history" aria-label="Recently read docs" hidden>
    <div class="history-head">
      <div>
        <h2 class="history-title">Recently read</h2>
        <p class="history-hint">Last 20 docs you opened with Doc Reader.</p>
      </div>
      <button id="history-clear" class="icon-btn ghost" title="Clear history" aria-label="Clear history" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
          <path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/>
        </svg>
      </button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </section>

  <template id="tpl-history-row">
    <li class="hist-row">
      <button class="hist-open" type="button">
        <span class="hist-dot" aria-hidden="true"></span>
        <span class="hist-meta">
          <span class="hist-title"></span>
          <span class="hist-sub">
            <span class="hist-site"></span>
            <span class="hist-when"></span>
          </span>
        </span>
      </button>
      <button class="icon-btn ghost hist-remove" type="button" title="Remove from history" aria-label="Remove from history">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </li>
  </template>

  <template id="tpl-site-row">
    <li class="site-row">
      <div class="site-info">
        <span class="site-dot" aria-hidden="true"></span>
        <div class="site-meta">
          <span class="site-label"></span>
          <span class="site-host"></span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" class="switch-input">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="sr-only switch-label"></span>
      </label>
    </li>
  </template>

  <template id="tpl-group">
    <article class="group" role="listitem">
      <header class="group-head">
        <div class="group-meta">
          <span class="group-site"></span>
          <span class="group-count" aria-label="Bookmark count"></span>
        </div>
        <a class="group-url" target="_blank" rel="noopener"></a>
      </header>
      <ul class="group-items"></ul>
    </article>
  </template>

  <template id="tpl-item">
    <li class="bm">
      <button class="bm-open" type="button">
        <span class="bm-dot" aria-hidden="true"></span>
        <span class="bm-text"></span>
      </button>
      <button class="icon-btn ghost bm-remove" type="button" title="Remove bookmark" aria-label="Remove bookmark">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
          <path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
    </li>
  </template>

  <template id="tpl-empty">
    <div class="empty" role="status">
      <svg class="empty-illo" viewBox="0 0 160 120" width="160" height="120" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M30 18h70a8 8 0 0 1 8 8v74l-22-14-22 14V26a8 8 0 0 1 8-8Z" opacity=".85"/>
        <path d="M46 36h44M46 50h44M46 64h28" opacity=".55"/>
        <circle cx="124" cy="40" r="14" opacity=".55"/>
        <path d="m118 40 4 4 8-8" opacity=".85"/>
      </svg>
      <p class="empty-title"></p>
      <p class="empty-hint"></p>
    </div>
  </template>

  <footer class="footer"><span class="version">v0.1.0</span></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
